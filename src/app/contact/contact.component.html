<div class="contact-container">
  <h2>Contact Me</h2>
  <form (submit)="submitForm()">
    <label for="name">Name:</label>
    <input id="name" type="text" [(ngModel)]="contact.name">

    <label for="email">Email:</label>
    <input id="email" type="email" [(ngModel)]="contact.email">

    <label for="message">Message:</label>
    <textarea id="message" [(ngModel)]="contact.message"></textarea>

    <button type="submit">Send</button>
  </form>
</div>
