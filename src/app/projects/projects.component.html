<div class="projects-container">
  <h2>My Projects</h2>
  <div class="project-list">
    <div class="project-card" *ngFor="let project of projects">
      <img [src]="project.image" alt="{{ project.name }}">
      <h3>{{ project.name }}</h3>
      <p>{{ project.description }}</p>
    </div>
  </div>
</div>
